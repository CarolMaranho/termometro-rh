<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parceiro do Líder - Chatbot RHBP</title>
    <meta name="description" content="Chatbot de RH Business Partner para líderes: feedback, desempenho, desligamento, conflitos, retenção, saúde mental e mais. Orientações práticas, roteiros de conversa e reflexões de mentor.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤝</text></svg>">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #333;
            --muted: #6b7785;
            --border: #e1e6ec;
            --bot-bubble: #ffffff;
            --user-bubble: #3498db;
            --mentor-bg: #fdf6ec;
            --mentor-border: #e67e22;
            --alert-bg: #fdecea;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 14px 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
            position: relative;
            flex-shrink: 0;
        }
        header::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #3498db, #f1c40f, #e67e22, #e74c3c);
        }
        .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
        .header-text h1 { font-size: 1.15rem; line-height: 1.2; }
        .header-text p { font-size: .85rem; opacity: .9; }
        .header-actions { margin-left: auto; display: flex; gap: 6px; }
        .icon-btn {
            background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3);
            border-radius: 8px; padding: 6px 10px; font-size: .8rem; cursor: pointer; white-space: nowrap;
        }
        .icon-btn:hover { background: rgba(255,255,255,.28); }
        .icon-btn.link { text-decoration: none; display: inline-flex; align-items: center; }

        main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

        #chat {
            flex: 1; overflow-y: auto; padding: 18px 16px 8px;
            scroll-behavior: smooth;
        }
        .chat-inner { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

        .msg { display: flex; gap: 8px; align-items: flex-end; animation: pop .2s ease-out; }
        .msg.user { justify-content: flex-end; }
        .msg .bubble {
            max-width: min(720px, 88%);
            padding: 12px 14px; border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
            overflow-wrap: anywhere;
        }
        .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
        .msg.bot .mini-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }

        @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .bubble h3 { font-size: 1.02rem; color: var(--primary); margin-bottom: 6px; }
        .bubble h4 { font-size: .9rem; color: var(--secondary); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .03em; }
        .bubble p { margin: 4px 0; }
        .bubble ul, .bubble ol { padding-left: 20px; margin: 4px 0; }
        .bubble li { margin: 3px 0; }
        .script {
            background: #f0f6fc; border-left: 4px solid var(--secondary);
            padding: 10px 12px; border-radius: 6px; margin: 4px 0; font-style: italic; white-space: pre-line;
        }
        .mentor {
            background: var(--mentor-bg); border-left: 4px solid var(--mentor-border);
            padding: 10px 12px; border-radius: 6px; margin-top: 12px;
        }
        .mentor strong { color: #b35c00; display: block; margin-bottom: 4px; font-style: normal; }
        .mentor p { font-style: italic; }
        .alert {
            background: var(--alert-bg); border-left: 4px solid var(--danger);
            padding: 10px 12px; border-radius: 6px; margin: 6px 0;
        }
        .tag { display: inline-block; font-size: .72rem; background: var(--light); color: var(--muted); padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .chip {
            background: #fff; border: 1.5px solid var(--secondary); color: var(--secondary);
            border-radius: 18px; padding: 6px 12px; font-size: .85rem; cursor: pointer; font-weight: 500;
            transition: all .15s;
        }
        .chip:hover { background: var(--secondary); color: #fff; }
        .chip.alt { border-color: var(--mentor-border); color: #b35c00; }
        .chip.alt:hover { background: var(--mentor-border); color: #fff; }

        .bubble-actions { display: flex; gap: 8px; margin-top: 10px; }
        .small-btn { background: none; border: none; color: var(--muted); font-size: .78rem; cursor: pointer; padding: 2px 0; }
        .small-btn:hover { color: var(--secondary); text-decoration: underline; }

        .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

        .composer { flex-shrink: 0; background: var(--card); border-top: 1px solid var(--border); padding: 10px 16px; }
        .composer form { max-width: 900px; margin: 0 auto; display: flex; gap: 8px; }
        .composer textarea {
            flex: 1; resize: none; border: 1.5px solid var(--border); border-radius: 12px;
            padding: 10px 12px; font-size: 1rem; max-height: 140px; min-height: 44px; outline: none;
        }
        .composer textarea:focus { border-color: var(--secondary); }
        .send-btn {
            background: linear-gradient(to right, var(--secondary), #2980b9); color: #fff; border: none;
            border-radius: 12px; padding: 0 18px; font-weight: 600; cursor: pointer; font-size: 1rem;
        }
        .send-btn:disabled { opacity: .5; cursor: default; }
        .disclaimer { max-width: 900px; margin: 6px auto 0; font-size: .72rem; color: var(--muted); text-align: center; }

        @media (max-width: 600px) {
            .header-text p { display: none; }
            .icon-btn .label { display: none; }
            .msg .bubble { max-width: 92%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="avatar">🤝</div>
            <div class="header-text">
                <h1>Parceiro do Líder</h1>
                <p>Seu RHBP de bolso para conversas e decisões sobre pessoas</p>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-menu" title="Ver temas">☰ <span class="label">Temas</span></button>
                <button class="icon-btn" id="btn-export" title="Baixar conversa">⬇ <span class="label">Baixar</span></button>
                <a class="icon-btn link" href="index.html.html" title="Voltar ao Termômetro do RH">🌡️ <span class="label">Termômetro</span></a>
            </div>
        </div>
    </header>

    <main>
        <div id="chat" aria-live="polite">
            <div class="chat-inner" id="chat-inner"></div>
        </div>
        <div class="composer">
            <form id="form">
                <textarea id="input" rows="1" placeholder="Conte a situação. Ex.: 'preciso dar um feedback difícil'" aria-label="Mensagem"></textarea>
                <button class="send-btn" id="send" type="submit" aria-label="Enviar">➤</button>
            </form>
            <p class="disclaimer">Orientação de apoio ao líder. Não substitui o RH, o jurídico nem canais oficiais. Não inclua nomes ou dados pessoais dos colaboradores.</p>
        </div>
    </main>

    <script>
    // =========================================================
    // BASE DE CONHECIMENTO RHBP
    // Cada tema: resumo, passos, roteiro, o que evitar,
    // perguntas para o líder refletir e a Visão do Mentor.
    // =========================================================
    const TEMAS = [
        {
            id: 'feedback',
            emoji: '💬',
            titulo: 'Dar feedback',
            tags: ['feedback', 'devolutiva', 'retorno', 'corrigir', 'chamar atencao', 'elogiar', 'comportamento', 'postura', 'falar com colaborador', 'feedback negativo', 'feedback corretivo', 'feedback positivo'],
            resumo: 'Feedback bom é específico, próximo do fato e focado em comportamento, não em personalidade. Use o modelo SCI: Situação, Comportamento, Impacto.',
            passos: [
                'Prepare-se: anote o fato observado (o que você viu ou ouviu), sem interpretações.',
                'Escolha o momento: em particular, o mais perto possível do ocorrido, sem pressa.',
                'Situação: diga quando e onde aconteceu.',
                'Comportamento: descreva o que a pessoa fez, como uma câmera registraria.',
                'Impacto: mostre a consequência para o time, o cliente ou o resultado.',
                'Escute: pergunte como a pessoa enxerga e deixe ela falar primeiro.',
                'Acordo: combinem juntos o que muda e quando vocês voltam a conversar.'
            ],
            roteiro: '"Quero conversar sobre a reunião de terça com o cliente (situação). Quando você interrompeu o cliente três vezes enquanto ele explicava o problema (comportamento), ele saiu com a sensação de não ter sido ouvido e pediu outro ponto focal (impacto). Como você enxergou aquela reunião?"',
            evitar: [
                'Sanduíche de elogio + crítica + elogio: a pessoa aprende a desconfiar do elogio.',
                'Rótulos ("você é desorganizado"). Fale do fato, não da identidade.',
                'Acumular problemas para despejar tudo na avaliação anual.',
                'Dar feedback na frente de outras pessoas ou por mensagem escrita.'
            ],
            perguntas: [
                'Eu conseguiria descrever o fato sem usar adjetivos?',
                'A pessoa sabia claramente o que era esperado dela?',
                'Estou dando esse feedback para ela crescer ou para eu desabafar?'
            ],
            mentor: 'Já vi muito líder adiar um feedback para "não magoar" e, seis meses depois, demitir a pessoa que nunca foi avisada. Isso não é gentileza, é omissão com prazo de validade. O feedback que você não dá hoje vira a injustiça que você comete amanhã. Coragem e cuidado não são opostos: o cuidado está justamente em dizer a verdade a tempo.',
            relacionados: ['baixa-performance', 'one-on-one', 'reconhecimento']
        },
        {
            id: 'baixa-performance',
            emoji: '📉',
            titulo: 'Baixa performance',
            tags: ['baixa performance', 'baixo desempenho', 'nao entrega', 'nao rende', 'desempenho ruim', 'resultado ruim', 'improdutivo', 'pip', 'plano de melhoria', 'plano de acao', 'abaixo do esperado', 'atrasa', 'atrasos', 'erra muito', 'erros', 'performance'],
            resumo: 'Antes de concluir que é falta de vontade, investigue a causa: clareza, capacidade, recursos ou motivação. Cada causa pede uma ação diferente.',
            passos: [
                'Diagnóstico: a pessoa sabe o que se espera dela? Tem as habilidades? Tem recursos e tempo? Quer fazer?',
                'Converse com fatos e números (entregas, prazos, qualidade), não com impressões.',
                'Monte um plano de melhoria com 2 a 3 metas mensuráveis e prazo de 30 a 60 dias.',
                'Defina o apoio que você vai dar: treinamento, acompanhamento, ajuste de carga.',
                'Faça checkpoints semanais curtos e registre tudo por escrito.',
                'Ao final, decida com base no que aconteceu: evolução, nova função ou desligamento.',
                'Envolva o RHBP desde o início, principalmente se o desligamento for uma possibilidade.'
            ],
            roteiro: '"Quero ser transparente com você: nos últimos dois meses, 4 das 6 entregas atrasaram mais de uma semana, e isso está impactando o fechamento do time. Quero entender o que está acontecendo do seu lado e construir com você um plano para virar esse jogo. O que está dificultando?"',
            evitar: [
                'Surpreender a pessoa com um desligamento sem ter dado sinais claros antes.',
                'Plano de melhoria "de fachada", feito só para formalizar uma demissão já decidida.',
                'Ignorar fatores pessoais ou de saúde que podem estar por trás da queda.',
                'Comparar a pessoa com colegas na frente dela.'
            ],
            perguntas: [
                'Qual parte disso é responsabilidade minha como líder (clareza, prioridade, apoio)?',
                'Essa pessoa já performou bem antes? O que mudou?',
                'Eu realmente acredito que ela pode melhorar? Se não, por que estou adiando a decisão?'
            ],
            mentor: 'Baixa performance raramente nasce do nada. Na maioria dos casos que acompanhei, havia uma expectativa nunca dita, uma prioridade que mudava toda semana ou um líder ausente. Antes de perguntar "o que há de errado com essa pessoa?", pergunte "o que eu construí para que isso acontecesse?". Não é culpa, é responsabilidade. E só quem assume a própria parte tem autoridade moral para cobrar a do outro.',
            relacionados: ['feedback', 'desligamento', 'saude-mental']
        },
        {
            id: 'desligamento',
            emoji: '🚪',
            titulo: 'Desligamento',
            tags: ['desligar', 'desligamento', 'demitir', 'demissao', 'mandar embora', 'dispensar', 'rescisao', 'corte', 'layoff', 'reducao de quadro', 'dispensa'],
            resumo: 'Desligar é uma das decisões mais sérias do líder. A forma como você faz define a dignidade de quem sai e a confiança de quem fica.',
            passos: [
                'Valide a decisão com o RHBP antes de qualquer conversa (histórico, riscos legais, estabilidades).',
                'Alinhe a logística: data, local reservado, documentos, acessos, comunicação ao time.',
                'Seja breve e claro: a decisão já foi tomada, não é uma negociação.',
                'Dê o motivo de forma objetiva e respeitosa, sem se alongar em justificativas.',
                'Deixe espaço para a reação da pessoa. Escute, não discuta.',
                'Explique os próximos passos (RH, verbas, devolução de equipamentos).',
                'Comunique ao time no mesmo dia, com respeito a quem saiu.'
            ],
            roteiro: '"Fulano, essa não é uma conversa fácil. A empresa decidiu encerrar seu contrato a partir de hoje. Nos últimos meses conversamos sobre as entregas e o plano de melhoria, e infelizmente os resultados não chegaram ao necessário. Sei que é difícil ouvir isso. A [pessoa do RH] vai te explicar todos os próximos passos. Quero agradecer pelo que você construiu aqui."',
            evitar: [
                'Desligar às sextas no fim do dia ou véspera de feriado sem necessidade.',
                'Pedir desculpas pela decisão ou dizer "não fui eu quem decidiu".',
                'Abrir debate sobre a decisão ou prometer reverter.',
                'Expor o motivo para o restante do time.'
            ],
            perguntas: [
                'A pessoa vai ser surpreendida? Se sim, onde eu falhei antes?',
                'Já checamos estabilidades (gestação, acidente, CIPA, pré-aposentadoria)?',
                'Como quero que essa pessoa fale da empresa daqui a um ano?'
            ],
            mentor: 'O desligamento mais difícil que conduzi não foi o mais tenso, foi o de alguém que eu deveria ter alertado meses antes. A pessoa me perguntou: "por que ninguém me disse?". Não tive resposta. Desde então aprendi que a conversa de desligamento começa muito antes: em cada feedback dado ou evitado. Quem sai sempre conta a história. Você decide se ela será de respeito ou de abandono.',
            relacionados: ['baixa-performance', 'juridico', 'mudanca']
        },
        {
            id: 'conflito',
            emoji: '⚡',
            titulo: 'Conflito no time',
            tags: ['conflito', 'briga', 'discussao', 'desentendimento', 'nao se dao bem', 'clima ruim entre', 'fofoca', 'intriga', 'rivalidade', 'atrito', 'tensao no time', 'panelinha'],
            resumo: 'Conflito sobre ideias pode ser saudável. Conflito pessoal que se arrasta contamina o time. Seu papel é mediar, não escolher um lado.',
            passos: [
                'Separe: é conflito de tarefa (como fazer), de processo (quem faz) ou de relacionamento?',
                'Converse individualmente com cada pessoa primeiro. Escute sem julgar.',
                'Identifique interesses por trás das posições ("o que você precisa de verdade?").',
                'Promova uma conversa conjunta com regras claras: um fala, o outro escuta.',
                'Foquem no futuro: o que cada um vai fazer diferente a partir de agora?',
                'Registre os acordos e acompanhe em 2 semanas.',
                'Se houver desrespeito, ameaça ou discriminação, trate como conduta e acione o RHBP.'
            ],
            roteiro: '"Chamei vocês dois porque percebo que a relação está atrapalhando o trabalho, e isso afeta o time inteiro. Não estou aqui para decidir quem tem razão. Quero que cada um explique o que precisa do outro para trabalhar bem. Depois vamos combinar juntos como seguir."',
            evitar: [
                'Esperar que o conflito "se resolva sozinho".',
                'Tomar partido de quem você tem mais afinidade.',
                'Expor o conflito em reunião com o time todo.',
                'Resolver separando as pessoas sem tratar a causa.'
            ],
            perguntas: [
                'Existe algo na estrutura (metas conflitantes, papéis confusos) alimentando isso?',
                'Eu estou sendo percebido como neutro pelas duas pessoas?',
                'Qual seria o custo de deixar isso como está por mais três meses?'
            ],
            mentor: 'Muito conflito entre pessoas é, na verdade, conflito de papéis mal definidos, e o líder chama de "questão de personalidade" porque é mais confortável. Antes de mediar a briga, olhe para o desenho: quem decide o quê, quem entrega para quem. Times maduros não são times sem conflito. São times que aprenderam a discordar sem se ferir. E isso se ensina pelo exemplo de quem lidera.',
            relacionados: ['feedback', 'engajamento', 'assedio']
        },
        {
            id: 'one-on-one',
            emoji: '🗓️',
            titulo: 'Reuniões 1:1',
            tags: ['1:1', '1 1', 'one on one', 'one-on-one', 'reuniao individual', 'conversa individual', 'acompanhamento', 'check-in', 'checkin', 'rotina com o time', 'reuniao semanal'],
            resumo: 'O 1:1 é o espaço do colaborador, não um relatório de status. É onde você constrói confiança e antecipa problemas.',
            passos: [
                'Frequência: semanal ou quinzenal, 30 minutos. Não desmarque, no máximo remarque.',
                'A pauta é da pessoa: peça que ela traga os temas.',
                'Divida o tempo: como ela está, o que está travando, desenvolvimento e feedback mútuo.',
                'Peça feedback sobre você: "o que eu poderia fazer melhor para te apoiar?".',
                'Anote combinados e retome no próximo encontro.'
            ],
            roteiro: 'Perguntas que funcionam:\n• "De 0 a 10, como você está essa semana? O que faria ser um ponto a mais?"\n• "O que está te travando que eu posso ajudar a destravar?"\n• "O que você gostaria de aprender nos próximos meses?"\n• "Tem algo que eu faço que atrapalha o seu trabalho?"',
            evitar: [
                'Transformar o 1:1 em cobrança de tarefas (isso cabe na reunião de time).',
                'Ficar olhando o celular ou o e-mail durante a conversa.',
                'Cancelar com frequência: a mensagem é "você não é prioridade".'
            ],
            perguntas: [
                'Quando foi a última vez que alguém do time me trouxe uma má notícia antes de ela virar crise?',
                'Eu sei o que motiva cada pessoa do meu time?'
            ],
            mentor: 'Os líderes que mais respeitei não eram os mais brilhantes tecnicamente. Eram os que lembravam do que você tinha dito há três semanas. O 1:1 não é sobre a tarefa, é sobre presença. E presença não se delega. Se você não tem tempo para seu time, preste atenção: talvez você esteja fazendo o trabalho do time em vez de liderar.',
            relacionados: ['feedback', 'pdi', 'engajamento']
        },
        {
            id: 'pdi',
            emoji: '🌱',
            titulo: 'PDI e carreira',
            tags: ['pdi', 'plano de desenvolvimento', 'desenvolvimento', 'carreira', 'crescer', 'crescimento', 'promocao', 'promover', 'proximo passo', 'trilha', 'sucessao', 'sucessor', 'treinamento', 'capacitacao'],
            resumo: 'Desenvolvimento acontece 70% na prática, 20% com outras pessoas e 10% em cursos. Um bom PDI tem poucas metas e muita prática.',
            passos: [
                'Comece pela aspiração da pessoa: onde ela quer chegar em 1 a 3 anos?',
                'Identifique 1 ou 2 competências prioritárias (forças a potencializar e gaps críticos).',
                'Para cada uma, defina ações 70-20-10: um desafio real, um mentor ou par, um conteúdo.',
                'Coloque prazos e evidências de evolução ("como saberemos que melhorou?").',
                'Revise a cada trimestre no 1:1.',
                'Sobre promoção: seja honesto sobre critérios, prazos e o que depende ou não de você.'
            ],
            roteiro: '"Quero investir no seu crescimento. Me conta: daqui a dois anos, que trabalho você gostaria de estar fazendo? ... Para chegar lá, vejo que [competência] é o ponto que mais vai fazer diferença. Que tal você liderar o projeto X nos próximos meses? Eu te acompanho de perto."',
            evitar: [
                'PDI com 8 metas que ninguém revisita.',
                'Prometer promoção sem ter orçamento ou aval.',

            perguntas: [

            ],

        },
        {
            id: 'avaliacao',
            emoji: '📊',
            titulo: 'Avaliação de desempenho',
            tags: ['avaliacao', 'avaliacao de desempenho', 'ciclo de avaliacao', 'calibracao', 'nota', 'nine box', '9 box', 'ninebox', 'performance review', 'meta', 'metas', 'okr', 'kpi'],

            passos: [

                <span class="tag">⚠️ Tema sensível</span>
                <h3>Relato de assédio, discriminação ou violência</h3>
                <div class="alert">
                    <p>Esse tipo de situação <strong>não deve ser investigado nem resolvido sozinho pelo líder</strong>. Acione o <strong>RHBP</strong> e/ou o <strong>canal de ética/compliance</strong> da empresa o quanto antes.</p>
                </div>
                <h4>O que fazer agora</h4>
                <ul>
                    <li>Acolha quem relatou: agradeça a confiança, leve a sério e não minimize.</li>
                    <li>Não prometa sigilo absoluto: diga que vai tratar com discrição e com quem precisa saber.</li>
                    <li>Registre os fatos relatados (data, local, o que aconteceu), sem interpretar.</li>
                    <li>Não confronte a pessoa acusada nem faça acareação.</li>
                    <li>Proteja quem relatou contra qualquer retaliação.</li>
                    <li>Se houver risco à integridade física, acione segurança e, se necessário, a polícia (190).</li>
                </ul>
                <div class="mentor"><strong>🧭 Visão do Mentor</strong><p>A pior resposta a uma denúncia não é a errada, é o silêncio. Quem relata está testando se a cultura da empresa é real ou só um quadro na parede. Sua reação nesses minutos vai ensinar ao time inteiro se é seguro falar.</p></div>`
        },
        {
            id: 'juridico',
            prioridade: 1,
            tags: ['justa causa', 'processo trabalhista', 'advertencia', 'suspensao', 'gravida', 'gravidez', 'gestante', 'estabilidade', 'acidente de trabalho', 'cipa', 'clt', 'hora extra', 'horas extras', 'banco de horas', 'jornada', 'ferias', 'sindicato', 'advogado'],
            render: () => `
                <span class="tag">⚖️ Tema com risco legal</span>
                <h3>Esse assunto precisa do RHBP (e talvez do jurídico)</h3>
                <p>Temas como justa causa, advertências, estabilidades (gestante, acidente, CIPA), jornada e horas extras têm regras legais e políticas internas específicas. Uma decisão errada pode gerar passivo trabalhista.</p>
                <h4>Antes de agir</h4>
                <ul>
                    <li>Não tome a decisão sozinho nem comunique nada ao colaborador ainda.</li>
                    <li>Reúna os fatos e documentos (datas, registros, e-mails, testemunhas).</li>
                    <li>Leve ao RHBP para análise da política e da legislação aplicável.</li>
                    <li>Medidas disciplinares precisam ser proporcionais, imediatas e consistentes com casos anteriores.</li>
                </ul>
                <div class="mentor"><strong>🧭 Visão do Mentor</strong><p>Pedir ajuda ao RH nesses casos não é fraqueza nem burocracia. É maturidade. O líder que decide sozinho pela pressa costuma descobrir, meses depois, que a conta chegou para a empresa e para ele.</p></div>`
        }
    ];

    // =========================================================
    // UTILITÁRIOS
    // =========================================================
    const chatInner = document.getElementById('chat-inner');
    const chatBox = document.getElementById('chat');
    const input = document.getElementById('input');
    const form = document.getElementById('form');
    const sendBtn = document.getElementById('send');
    const historico = []; // para exportar a conversa

    function normalizar(txt) {
        return (' ' + txt + ' ').toLowerCase()
            .normalize('NFD').replace(/[̀-ͯ]/g, '')
            .replace(/[^a-z0-9:\- ]/g, ' ')
            .replace(/\s+/g, ' ');
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function htmlParaTexto(html) {
        const div = document.createElement('div');
        div.innerHTML = html.replace(/<\/(p|li|h3|h4|div)>/g, '\n').replace(/<br\s*\/?>/g, '\n');
        return div.textContent.replace(/\n\s*\n+/g, '\n').trim();
    }

    function rolar() { chatBox.scrollTop = chatBox.scrollHeight; }

    function pontuar(textoNorm, tags) {
        let score = 0;
        for (const tag of tags) {
            const t = normalizar(tag).trim();
            // Palavra/expressão inteira, para "pdi" não casar dentro de outra palavra
            if (textoNorm.includes(' ' + t + ' ') || (t.length > 5 && textoNorm.includes(t))) {
                score += t.includes(' ') ? 3 : 2;
            }
        }
        return score;
    }

    function temaPorId(id) {
        return TEMAS.find(t => t.id === id) || SENSIVEIS.find(s => s.id === id);
    }

    // =========================================================
    // RENDERIZAÇÃO DE MENSAGENS
    // =========================================================
    function addUser(texto) {
        const wrap = document.createElement('div');
        wrap.className = 'msg user';
        const b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = texto;
        wrap.appendChild(b);
        chatInner.appendChild(wrap);
        historico.push('Você: ' + texto);
        rolar();
    }

    function addBot(html, chips = [], { copiavel = false } = {}) {
        const wrap = document.createElement('div');
        wrap.className = 'msg bot';
        wrap.innerHTML = '<div class="mini-avatar">🤝</div>';
        const b = document.createElement('div');
        b.className = 'bubble';
        b.innerHTML = html;

        if (copiavel) {
            const acts = document.createElement('div');
            acts.className = 'bubble-actions';
            const btn = document.createElement('button');
            btn.className = 'small-btn';
            btn.textContent = '📋 Copiar orientação';
            btn.onclick = () => copiar(htmlParaTexto(html), btn);
            acts.appendChild(btn);
            b.appendChild(acts);
        }

        if (chips.length) {
            const c = document.createElement('div');
            c.className = 'chips';
            chips.forEach(ch => {
                const el = document.createElement('button');
                el.className = 'chip' + (ch.alt ? ' alt' : '');
                el.textContent = ch.label;
                el.onclick = () => { addUser(ch.label); responderComDelay(() => ch.acao()); };
                c.appendChild(el);
            });
            b.appendChild(c);
        }

        wrap.appendChild(b);
        chatInner.appendChild(wrap);
        historico.push('Parceiro do Líder: ' + htmlParaTexto(html));
        rolar();
    }

    function responderComDelay(fn) {
        sendBtn.disabled = true;
        const wrap = document.createElement('div');
        wrap.className = 'msg bot';
        wrap.innerHTML = '<div class="mini-avatar">🤝</div><div class="bubble typing"><span></span><span></span><span></span></div>';
        chatInner.appendChild(wrap);
        rolar();
        setTimeout(() => { wrap.remove(); sendBtn.disabled = false; fn(); }, 550);
    }

    function copiar(texto, btn) {
        const ok = () => { const o = btn.textContent; btn.textContent = '✅ Copiado!'; setTimeout(() => btn.textContent = o, 1500); };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(texto).then(ok).catch(() => fallbackCopiar(texto, ok));
        } else { fallbackCopiar(texto, ok); }
    }
    function fallbackCopiar(texto, ok) {
        const ta = document.createElement('textarea');
        ta.value = texto; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) {}
        ta.remove();
    }

    // =========================================================
    // RESPOSTAS
    // =========================================================
    function chipsTema(id) { return { label: temaPorId(id).emoji + ' ' + temaPorId(id).titulo, acao: () => mostrarTema(id) }; }

    const chipMenu = { label: '☰ Ver todos os temas', acao: () => mostrarMenu(), alt: true };
    const chipPreparar = { label: '🛠️ Preparar uma conversa', acao: () => iniciarPreparo(), alt: true };

    function mostrarTema(id) {
        preparo = null;
        const t = temaPorId(id);
        if (!t) return naoEntendi();
        if (t.render) { addBot(t.render(), [chipPreparar, chipMenu], { copiavel: true }); return; }

        const html = `
            <span class="tag">${t.emoji} ${t.titulo}</span>
            <h3>${t.titulo}</h3>
            <p>${t.resumo}</p>
            <h4>Passo a passo</h4>
            <ol>${t.passos.map(p => `<li>${p}</li>`).join('')}</ol>
            <h4>Como falar</h4>
            <div class="script">${t.roteiro}</div>
            <h4>Evite</h4>
            <ul>${t.evitar.map(p => `<li>${p}</li>`).join('')}</ul>
            <h4>Perguntas para você refletir</h4>
            <ul>${t.perguntas.map(p => `<li>${p}</li>`).join('')}</ul>
            <div class="mentor"><strong>🧭 Visão do Mentor</strong><p>${t.mentor}</p></div>`;

        const chips = [chipPreparar, ...t.relacionados.map(chipsTema), chipMenu];
        addBot(html, chips, { copiavel: true });
    }

    function mostrarMenu() {
        preparo = null;
        addBot('<p>Escolha um tema ou descreva a situação com suas palavras:</p>',
            [...TEMAS.map(t => chipsTema(t.id)), chipPreparar]);
    }

    function naoEntendi() {
        addBot(`<p>Não tenho certeza de qual tema se encaixa melhor. Pode me contar com outras palavras?</p>
            <p>Exemplos: <em>"tenho um colaborador que vive atrasando entregas"</em>, <em>"preciso desligar alguém"</em>, <em>"meu time está desmotivado"</em>.</p>`,
            [chipMenu, chipPreparar]);
    }

    function boasVindas() {
        addBot(`<h3>Olá, líder! 👋</h3>
            <p>Sou o <strong>Parceiro do Líder</strong>, um apoio de RH Business Partner para as situações de gente do seu dia a dia.</p>
            <p>Me conte o que está acontecendo, escolha um tema ou use <strong>Preparar uma conversa</strong> para montar um roteiro sob medida.</p>
            <div class="mentor"><strong>🧭 Visão do Mentor</strong><p>Liderar é, no fundo, ter as conversas que os outros evitam. Não espere estar pronto. Ninguém fica. Prepare-se o suficiente e vá.</p></div>`,
            [chipsTema('feedback'), chipsTema('baixa-performance'), chipsTema('desligamento'), chipsTema('conflito'), chipsTema('saude-mental'), chipPreparar, chipMenu]);
    }

    // =========================================================
    // FLUXO GUIADO: PREPARAR UMA CONVERSA
    // =========================================================
    let preparo = null;

    const TIPOS_CONVERSA = {
        corretivo: { label: 'Feedback de ajuste', abertura: 'Quero conversar com você sobre algo que observei e que acho importante ajustarmos juntos.' },
        positivo: { label: 'Reconhecimento', abertura: 'Quero tirar um momento para reconhecer algo que você fez.' },
        performance: { label: 'Baixa performance', abertura: 'Quero ter uma conversa franca sobre suas entregas recentes, porque quero te ver indo bem aqui.' },
        conflito: { label: 'Conflito entre pessoas', abertura: 'Chamei você porque percebo que a relação com um colega está atrapalhando o trabalho, e quero ajudar a resolver.' },
        carreira: { label: 'Carreira e desenvolvimento', abertura: 'Quero usar esse tempo para falarmos do seu crescimento e de onde você quer chegar.' },
        outro: { label: 'Outro assunto', abertura: 'Quero conversar sobre um assunto importante, e queria ouvir você também.' }
    };

    function iniciarPreparo() {
        preparo = { etapa: 'tipo' };
        addBot('<h3>🛠️ Vamos preparar sua conversa</h3><p>São 3 perguntas rápidas. <strong>Não use nomes nem dados pessoais.</strong></p><p>Qual é o tipo de conversa?</p>',
            Object.entries(TIPOS_CONVERSA).map(([k, v]) => ({ label: v.label, acao: () => preparoTipo(k) })));
    }

    function preparoTipo(k) {
        preparo = { etapa: 'fato', tipo: k };
        addBot(`<p><strong>1/3.</strong> Descreva o <strong>fato</strong> que você observou, como uma câmera registraria (quando, onde, o que a pessoa fez ou disse).</p>
            <p><em>Ex.: "Nas últimas 3 reuniões de segunda, chegou 20 minutos atrasado sem avisar."</em></p>`);
        input.focus();
    }

    function continuarPreparo(texto) {
        if (preparo.etapa === 'fato') {
            preparo.fato = texto; preparo.etapa = 'impacto';
            addBot(`<p><strong>2/3.</strong> Qual foi o <strong>impacto</strong> disso (no time, no cliente, no resultado, em você)?</p>
                <p><em>Ex.: "O time precisou repetir o alinhamento e atrasamos a decisão."</em></p>`);
        } else if (preparo.etapa === 'impacto') {
            preparo.impacto = texto; preparo.etapa = 'objetivo';
            addBot(`<p><strong>3/3.</strong> O que você quer que esteja <strong>combinado ao final</strong> da conversa?</p>
                <p><em>Ex.: "Que ele chegue no horário ou avise com antecedência."</em></p>`);
        } else if (preparo.etapa === 'objetivo') {
            preparo.objetivo = texto;
            gerarRoteiro();
            preparo = null;
        }
    }

    function gerarRoteiro() {
        const tipo = TIPOS_CONVERSA[preparo.tipo];
        const limpar = s => { s = s.trim().replace(/[.!]+$/, ''); return escapeHtml(s.charAt(0).toLowerCase() + s.slice(1)); };
        const fato = limpar(preparo.fato);
        const impacto = limpar(preparo.impacto);
        const objetivo = limpar(preparo.objetivo);
        const positivo = preparo.tipo === 'positivo';

        const html = `
            <span class="tag">🛠️ Roteiro: ${tipo.label}</span>
            <h3>Seu roteiro de conversa</h3>
            <h4>1. Abertura</h4>
            <div class="script">"${tipo.abertura}"</div>
            <h4>2. Fato</h4>
            <div class="script">"${positivo ? 'Percebi que' : 'Observei que'} ${fato}."</div>
            <h4>3. Impacto</h4>
            <div class="script">"${positivo ? 'Isso fez diferença porque' : 'Isso gerou um impacto:'} ${impacto}."</div>
            <h4>4. Escuta</h4>
            ${positivo
                ? '<div class="script">"Como foi para você fazer isso? O que te ajudou?"</div>'
                : '<div class="script">"Como você enxerga essa situação? Tem algo acontecendo que eu não estou vendo?"</div><p>Deixe a pessoa falar. Escute para entender, não para rebater.</p>'}
            <h4>5. Acordo</h4>
            <div class="script">"${positivo ? 'Quero que você continue assim. Como posso te apoiar para' : 'O que eu gostaria que combinássemos é:'} ${objetivo}${positivo ? '?' : '. O que você precisa de mim para que isso aconteça?'}"</div>
            <h4>6. Fechamento</h4>
            <div class="script">"${positivo ? 'Obrigado de verdade. Isso não passa despercebido.' : 'Vamos voltar a conversar em [data] para ver como está indo. Obrigado por estar aberto a essa conversa.'}"</div>
            <h4>Checklist antes de entrar</h4>
            <ul>
                <li>Local reservado e tempo suficiente, sem interrupções.</li>
                <li>Você está calmo? Se não, adie algumas horas.</li>
                <li>Releia o fato: há algum julgamento ou adjetivo que dá para tirar?</li>
                <li>Registre os combinados por escrito após a conversa.</li>
            </ul>
            <div class="mentor"><strong>🧭 Visão do Mentor</strong><p>O roteiro serve para você não se perder, não para ser recitado. A conversa de verdade começa quando você para de falar e a pessoa responde. Entre preparado, mas saia diferente do que entrou: se você não aprendeu nada sobre o outro, foi um monólogo, não uma conversa.</p></div>`;

        const chips = [{ label: '🔁 Preparar outra conversa', acao: () => iniciarPreparo(), alt: true }];
        const rel = { corretivo: 'feedback', positivo: 'reconhecimento', performance: 'baixa-performance', conflito: 'conflito', carreira: 'pdi' }[preparo.tipo];
        if (rel) chips.push(chipsTema(rel));
        chips.push(chipMenu);
        addBot(html, chips, { copiavel: true });
    }

    // =========================================================
    // ROTEAMENTO DA MENSAGEM LIVRE
    // =========================================================
    function processar(texto) {
        const norm = normalizar(texto);

        // Comandos
        if (/^ ?(menu|temas|ajuda|help|inicio|voltar) ?$/.test(norm)) return mostrarMenu();
        if (/^ ?(oi|ola|bom dia|boa tarde|boa noite|e ai|hey) ?$/.test(norm)) return boasVindas();
        if (/(obrigad|valeu|agradeco)/.test(norm) && norm.length < 30) {
            return addBot('<p>Por nada! Conte comigo sempre que precisar. 💙</p>', [chipMenu]);
        }
        if (/(preparar|montar|roteiro).*(conversa|reuniao|feedback)/.test(norm)) return iniciarPreparo();

        // Temas sensíveis primeiro (por prioridade)
        const sens = SENSIVEIS
            .map(s => ({ s, score: pontuar(norm, s.tags) }))
            .filter(x => x.score > 0)
            .sort((a, b) => b.s.prioridade - a.s.prioridade);
        if (sens.length) {
            addBot(sens[0].s.render(), [chipPreparar, chipMenu], { copiavel: true });
            return;
        }

        // Temas gerais
        const ranking = TEMAS
            .map(t => ({ t, score: pontuar(norm, t.tags) }))
            .filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score);

        if (!ranking.length) return naoEntendi();

        mostrarTema(ranking[0].t.id);

        // Se outro tema também pontuou bem, sugere
        const outros = ranking.slice(1, 3).filter(x => x.score >= ranking[0].score - 1);
        if (outros.length) {
            setTimeout(() => addBot('<p>Sua situação também pode envolver:</p>', outros.map(x => chipsTema(x.t.id))), 300);
        }
    }

    // =========================================================
    // EVENTOS
    // =========================================================
    form.addEventListener('submit', e => {
        e.preventDefault();
        const texto = input.value.trim();
        if (!texto || sendBtn.disabled) return;
        addUser(texto);
        input.value = '';
        autoResize();
        responderComDelay(() => {
            if (preparo && preparo.etapa !== 'tipo') continuarPreparo(texto);
            else { preparo = null; processar(texto); }
        });
    });

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    function autoResize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
    input.addEventListener('input', autoResize);

    document.getElementById('btn-menu').onclick = () => { addUser('Ver temas'); responderComDelay(mostrarMenu); };

    document.getElementById('btn-export').onclick = () => {
        const data = new Date().toLocaleString('pt-BR');
        const conteudo = `Parceiro do Líder - Conversa exportada em ${data}\n${'='.repeat(50)}\n\n` + historico.join('\n\n---\n\n');
        const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'conversa-parceiro-do-lider.txt';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };

    boasVindas();
    </script>
</body>
</html>
